name: build-macOS

on:
  push:
    branches: [ "main" ]
    paths:
      - "**/*.cpp"
      - "**/*.c"
      - "**/*.hpp"
      - "**/*.h"
      - "Makefile"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
  workflow_dispatch:

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel is x86_64, macos-15 is arm64.
        runner: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v4

    - name: install dependencies
      run: brew install allegro pkg-config

    - name: show allegro version
      run: pkg-config --modversion allegro-5

    - name: build
      run: make

    - name: run test mode
      run: ./game --test
