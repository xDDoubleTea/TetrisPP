name: build-linux

on:
  push:
    branches: [ "main" ]
    paths:
      - "**/*.cpp"
      - "**/*.c"
      - "**/*.hpp"
      - "**/*.h"
      - "Makefile"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
  workflow_dispatch:

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config \
          liballegro5-dev liballegro-image5-dev liballegro-ttf5-dev \
          liballegro-audio5-dev liballegro-acodec5-dev

    - name: show allegro version
      run: pkg-config --modversion allegro-5

    - name: build
      run: make

    - name: run test mode
      run: ./game --test
