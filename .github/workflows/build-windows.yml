name: build-windows

on:
  push:
    branches: [ "main" ]
    paths:
      - "**/*.cpp"
      - "**/*.c"
      - "**/*.hpp"
      - "**/*.h"
      - "Makefile"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - uses: actions/checkout@v4

    - uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          make
        pacboy: >-
          gcc:p
          pkgconf:p
          allegro:p

    - name: show allegro version
      run: pkg-config --modversion allegro-5

    - name: build
      run: make

    - name: run test mode
      run: ./game.exe --test
